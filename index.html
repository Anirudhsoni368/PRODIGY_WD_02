<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Stopwatch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stopwatch-container">

        <!-- Title -->
        <h1>Stopwatch</h1>

        <p class="subtitle">
            Track your time with precision
        </p>


        <!-- Time Display -->
        <div class="time-display" id="display">
            00:00:00.000
        </div>


        <!-- Control Buttons -->
        <div class="controls">

            <button id="startBtn">
                ▶ Start
            </button>

            <button id="pauseBtn">
                ⏸ Pause
            </button>

            <button id="lapBtn">
                🏁 Lap
            </button>

            <button id="resetBtn">
                🔄 Reset
            </button>

        </div>


        <!-- Lap Section -->
        <div class="lap-section">

            <h2>Lap Times</h2>

            <ul id="lapList">
                <!-- Lap times will appear here -->
            </ul>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
